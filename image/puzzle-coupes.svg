        <circle cx="15" cy="33" r="3.6" fill="#141416" stroke="#d4af37" stroke-width="1.6"/>
        <circle cx="49" cy="33" r="3.6" fill="#141416" stroke="#d4af37" stroke-width="1.6"/>
